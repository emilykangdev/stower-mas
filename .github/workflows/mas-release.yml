name: MAS Release

# Manually triggered: archives StowerMacMAS with Apple Distribution signing,
# exports a .pkg via ExportOptionsMAS.plist, and uploads it to App Store
# Connect. No Sparkle, no DMG, no GitHub Release — MAS-only.
#
# Prerequisites (GitHub repository secrets):
#   MAS_APP_DISTRIBUTION_P12         — base64 of Apple Distribution .p12
#   MAS_APP_DISTRIBUTION_PASSWORD    — password for that .p12
#   MAS_INSTALLER_DISTRIBUTION_P12   — base64 of Mac Installer Distribution .p12
#   MAS_INSTALLER_DISTRIBUTION_PASSWORD — password for that .p12
#   MAS_PROVISIONING_PROFILE         — base64 of Mac App Store provisioning profile
#   APP_STORE_CONNECT_KEY_ID         — API key ID (e.g. BXMZW4LMSP)
#   APP_STORE_CONNECT_ISSUER_ID      — API key issuer UUID
#   APP_STORE_CONNECT_KEY            — base64 of App Store Connect API .p8 key
#
# Process:
#   1. Bump CURRENT_PROJECT_VERSION in project.pbxproj
#   2. Run this workflow (workflow_dispatch)
#   3. Build appears in TestFlight — verify, then submit for review manually

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0)"
        required: true
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: mas-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: Derive build number
        id: build
        env:
          PAGES_BRANCH: gh-pages
        run: |
          # For the first MAS build, use build number 1. For subsequent builds,
          # read the last build number from App Store Connect manually and bump
          # CURRENT_PROJECT_VERSION in the pbxproj before dispatching.
          # This step reads CURRENT_PROJECT_VERSION directly from the built
          # project settings so the workflow never hardcodes it.
          BUILD=$(xcodebuild \
            -project StowerMac/StowerMac.xcodeproj \
            -scheme StowerMacMAS \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | awk '/[[:space:]]CURRENT_PROJECT_VERSION = /{print $3}')
          if [ -z "$BUILD" ] || ! echo "$BUILD" | grep -qE '^[0-9]+$'; then
            echo "ERROR: Could not derive CURRENT_PROJECT_VERSION from build settings." >&2
            exit 1
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build number: $BUILD"

      - name: Create temp keychain and import certificates
        env:
          CERT_P12_BASE64: ${{ secrets.MAS_APP_DISTRIBUTION_P12 }}
          CERT_PASSWORD: ${{ secrets.MAS_APP_DISTRIBUTION_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_DISTRIBUTION_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAS_INSTALLER_DISTRIBUTION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAS_APP_DISTRIBUTION_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          KEYCHAIN_PW="$(openssl rand -hex 32)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12
          security import "$RUNNER_TEMP/installer.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$INSTALLER_PASSWORD" \
            -A -t cert -f pkcs12

          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/"//g')"
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer.p12"
          # Log certs found for debugging
          security find-identity -p basic -v | grep -iE "distribution|installer|developer" || true
          echo "Certificates imported."

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/stower_mas_appstore.provisionprofile"
          echo "Provisioning profile installed."

      - name: Place App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "API key placed."

      - name: Archive
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/StowerMac.xcarchive"
          xcodebuild archive \
            -project StowerMac/StowerMac.xcodeproj \
            -scheme StowerMacMAS \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=2446N3925D
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "Archive: DONE"

      - name: Export .pkg
        env:
          VERSION: ${{ inputs.version }}
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist Scripts/release/ExportOptionsMAS.plist

          # Find the exported .pkg
          PKG_PATH=$(find "$EXPORT_DIR" -name "*.pkg" -type f | head -1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: No .pkg file found in export directory." >&2
            ls -la "$EXPORT_DIR" >&2
            exit 1
          fi
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
          echo "Exported .pkg: $PKG_PATH"

      - name: Verify .pkg signature and size
        env:
          PKG_PATH: ${{ env.PKG_PATH }}
        run: |
          echo "=== Signature check ==="
          pkgutil --check-signature "$PKG_PATH" || {
            echo "ERROR: .pkg signature verification failed." >&2
            exit 1
          }
          echo "Signature: VALID"

          echo "=== Size check ==="
          SIZE=$(stat -f '%z' "$PKG_PATH")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: .pkg size $SIZE is below 1MB — likely degenerate." >&2
            exit 1
          fi
          echo "Size: OK"

      - name: Upload to App Store Connect
        env:
          PKG_PATH: ${{ env.PKG_PATH }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          OUT=$(xcrun altool --upload-package "$PKG_PATH" \
            --type macos \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1) || true
          echo "$OUT"
          if ! echo "$OUT" | grep -q "No errors uploading"; then
            echo "ERROR: altool upload did not report success." >&2
            exit 1
          fi
          echo "Upload: SUCCESS"

      - name: Clean up temp keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "Temp keychain deleted."
          fi